<!DOCTYPE html>
<html>
<head>
<title>Register | SISIL TEJAS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body {
  background: linear-gradient(135deg,#141e30,#243b55);
}
.card { width: 380px; }
</style>
</head>

<body class="d-flex justify-content-center align-items-center vh-100">

<div class="card p-4 shadow">
  <h3 class="text-center mb-3">Register</h3>

  <input id="name" class="form-control mb-3" placeholder="Full Name">
  <input id="email" class="form-control mb-3" placeholder="Email">
  <input id="password" type="password" class="form-control mb-3" placeholder="Password">

  <button class="btn btn-success w-100" onclick="register()">Register</button>

  <p class="text-center mt-2">
    Already registered?
    <a href="login.html">Login</a>
  </p>
</div>

<script>
function register(){
  const user = {
    name: name.value,
    email: email.value,
    password: password.value
  };

  localStorage.setItem(email.value, JSON.stringify(user));
  alert("Registered successfully!");
  window.location = "login.html";
}
</script>

</body>
</html>
